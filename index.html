<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>橋本尚儒 — Product Engineer</title>
<meta name="description" content="橋本尚儒 (Takahito Hashimoto) のポートフォリオ。READYFOR株式会社でプロダクトエンジニアとして、クラウドファンディングプラットフォームの設計・開発をリード。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,800&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-white text-ink font-jp leading-[1.85]">

<div class="lang-switch fixed top-[22px] right-6 z-10 flex items-center gap-1.5 font-meta text-[0.68rem] tracking-wide" role="group" aria-label="Language">
  <button type="button" data-lang="ja" aria-current="true" class="p-1 m-0 bg-transparent border-none cursor-pointer font-inherit text-[inherit] text-ink-faint aria-[current=true]:text-ink aria-[current=true]:font-semibold aria-[current=true]:underline aria-[current=true]:underline-offset-[3px]">JA</button>
  <span aria-hidden="true" class="text-rule">/</span>
  <button type="button" data-lang="en" class="p-1 m-0 bg-transparent border-none cursor-pointer font-inherit text-[inherit] text-ink-faint aria-[current=true]:text-ink aria-[current=true]:font-semibold aria-[current=true]:underline aria-[current=true]:underline-offset-[3px]">EN</button>
</div>

<main class="max-w-[800px] mx-auto px-6 pt-[clamp(56px,10vw,120px)] pb-20">

  <!-- Hero -->
  <section class="pb-16">
    <h1 id="role" class="font-display italic font-semibold text-[clamp(2.3rem,6.8vw,3.2rem)] leading-[1.2]">Product Engineer</h1>
    <div class="flex items-center justify-between flex-wrap gap-3 mt-2.5">
      <p id="name-en" class="font-display text-base text-ink-soft font-medium">橋本尚儒 / Takahito Hashimoto</p>
      <div id="links" class="flex gap-4"></div>
    </div>
  </section>

  <!-- About / Stack -->
  <section class="grid grid-cols-1 split:grid-cols-[1fr_200px] gap-10 pt-16 pb-16 border-t border-rule">
    <div>
      <h2 class="font-meta text-[0.85rem] text-ink-faint font-medium tracking-wider uppercase mb-7">About</h2>
      <div id="about-list" class="prose-body"></div>
    </div>
    <div>
      <h2 class="font-meta text-[0.85rem] text-ink-faint font-medium tracking-wider uppercase mb-7">Stack</h2>
      <div id="stack-list" class="grid [grid-template-columns:repeat(auto-fit,minmax(160px,1fr))] gap-7"></div>
    </div>
  </section>

  <!-- Experience -->
  <section class="pt-16 pb-16 border-t border-rule">
    <h2 class="font-meta text-[0.85rem] text-ink-faint font-medium tracking-wider uppercase mb-7">Experience</h2>
    <div id="experience-list"></div>
  </section>

</main>

<footer id="footer-text" class="max-w-[800px] mx-auto px-6 pb-14 font-meta text-[0.8rem] text-ink-faint"></footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
